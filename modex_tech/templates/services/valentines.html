<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Valentine's Day ❤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .card {
            width: 90%;
            max-width: 700px;
            padding: 50px 30px;
            text-align: center;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 25px;
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
        }

        .heart {
            font-size: 80px;
            animation: beat 1s infinite;
        }

        h1 {
            font-size: 48px;
            margin: 15px 0;
        }

        p {
            font-size: 20px;
            line-height: 1.7;
        }

        .message {
            margin: 30px auto;
            max-width: 550px;
        }

        .button {
            display: inline-block;
            padding: 14px 30px;
            background: white;
            color: #ff4f70;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            margin-top: 15px;
        }

        @keyframes beat {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.2);
            }
        }
    </style>
</head>

<body>

    <div class="card">
        <div class="heart">❤️</div>

        <h1>Happy Valentine's Day</h1>

        <div class="message">
            <p>
                To someone truly special,
            </p>

            <p>
                May today remind you of how loved,
                appreciated, and amazing you are.
                Every moment with you is worth remembering.
            </p>

            <p>
                Here's to love, laughter, and beautiful memories. ❤️
            </p>
        </div>

        <a href="#" class="button">With Love ❤️</a>
    </div>

</body>
</html>
