<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Apply Promocode</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f5f5f5;
        }
    </style>
</head>

<body>

<!-- Flash Messages -->
<div class="container mt-3">
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, msg in messages %}
        <div class="alert alert-{{ category }} alert-dismissible fade show">
            {{ msg }}
            <button class="btn-close" data-bs-dismiss="alert"></button>
        </div>
    {% endfor %}
    {% endwith %}
</div>

<!-- Apply Modal -->
<div class="modal fade" id="loginModal" tabindex="-1">
  <div class="modal-dialog modal-sm modal-dialog-centered">
    <div class="modal-content">

      <form method="POST" action="{{ url_for('pages.apply_promo') }}">
        <div class="modal-header">
          <h5 class="modal-title">Apply Promo</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body">
          <input class="form-control mb-2" name="promo" placeholder="Promo code">

          <!-- current page -->
          <input type="hidden" name="next" value="{{ request.url }}">
        </div>

        <div class="modal-footer flex-column">
          <!-- Apply promo -->
          <button type="submit" name="action" value="apply" class="btn btn-primary w-100">
            Apply Promo
          </button>

          <!-- Skip promo -->
          <button type="submit" name="action" value="skip" class="btn btn-outline-secondary w-100">
            Skip Promo
          </button>
        </div>

      </form>

    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const modal = new bootstrap.Modal(document.getElementById("loginModal"));
    modal.show();
});
</script>

</body>
</html>
