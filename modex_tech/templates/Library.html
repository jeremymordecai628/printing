<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Applications</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #f1f5f9;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .card {
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
            background: #334155;
        }

        .title {
            font-size: 1.3rem;
            margin-bottom: 10px;
            color: #38bdf8;
        }

        .desc {
            font-size: 0.9rem;
            margin-bottom: 10px;
            color: #cbd5f5;
        }

        .meta {
            font-size: 0.8rem;
            color: #94a3b8;
        }

        .btn {
            margin-top: 15px;
            display: inline-block;
            padding: 8px 14px;
            background: #3b82f6;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .btn:hover {
            background: #2563eb;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Available Applications</h1>

    <div class="grid">
        {% for app in apps %}
        <div class="card">
            <div class="title">{{ app.name }}</div>

            <div class="desc">
                {{ app.description or "No description available" }}
            </div>

            <div class="meta">
                Version: {{ app.version or "N/A" }} <br>
                Created: {{ app.created_at.strftime('%Y-%m-%d') if app.created_at else "N/A" }}
            </div>

            <a href="/{{ app.slug }}" class="btn">
                Open App
            </a>
        </div>
        {% endfor %}
	        <a href="{{ url_for('pages.home') }}" class="btn">
            ← Back Home
        </a>
    </div>
</div>

</body>
</html>
