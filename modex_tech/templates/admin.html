<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        .box {
            border: 1px solid #ddd;
            padding: 20px;
            margin-bottom: 20px;
            width: 400px;
        }

        input, button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
        }

        button {
            cursor: pointer;
        }

        .primary { background: #007bff; color: white; border: none; }
        .danger { background: #dc3545; color: white; border: none; }
        .success { background: #28a745; color: white; border: none; }
    </style>
</head>

<body>

<h2>Admin Panel</h2>

<form method="POST" action="{{ url_for('pages.admin') }}">

    <!-- ========================= -->
    <!-- 1. PROMO CODE GENERATION -->
    <!-- ========================= -->
    <div class="box">
        <h3>Create Promo Code</h3>

        <input type="hidden" name="value" value="1">

        <button type="submit" class="success">
            Generate Promo Code
        </button>
    </div>


    <!-- ========================= -->
    <!-- 2. GIT CLONE SECTION -->
    <!-- ========================= -->
    <div class="box">
        <h3>Clone Repository</h3>

        <input type="text" name="link_value" placeholder="Git repo URL (https://...)">

        <button type="submit" class="primary">
            Clone Repo
        </button>
    </div>


    <!-- ========================= -->
    <!-- 3. PAYMENT LOOKUP -->
    <!-- ========================= -->
    <div class="box">
        <h3>Fetch Payment Info</h3>

        <input type="text" name="doc_id" placeholder="Enter document ID">

        <button type="submit" class="danger">
            Fetch Payment
        </button>
    </div>

</form>

<hr>

<!-- ========================= -->
<!-- OPTIONAL DISPLAY AREA -->
<!-- ========================= -->
{% if file_info %}
<div class="box">
    <h3>File Info</h3>

    <p><b>Charges:</b> {{ file_info.charges }}</p>
    <p><b>Amount Paid:</b> {{ file_info.amount_paid }}</p>
    <p><b>Status:</b> {{ file_info.status }}</p>
    <p><b>File Path:</b> {{ file_info.file_path }}</p>
</div>
{% endif %}

</body>
</html>
